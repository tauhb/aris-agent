# Lớp giao diện web của aris, chỉ gắn vào profile `aris` (web), xếp sau
# dsh-web-app và @aris/bundle. Mỗi mảnh giao diện của dsh khác với canvas được
# tắt đi và thay bằng một gói aris giữ nguyên hợp đồng slot (dsh không cho đổi
# tên gói của row có sẵn, nên phải tắt row gốc rồi chèn row mới).

# Thanh bên trái: Đội hình, Việc mới, các trang theo canvas.
- id: ui-sidebar
  name: '@deepseek-ai/dsh-client-ui-sidebar'
  disabled: true

- insert:
    # Theme aris cho toàn app: ghi đè token màu, nền, viền, chữ, phông của dsh.
    - id: aris-ui-theme
      name: '@aris/ui-theme'

    # Thêm "Tiếng Việt" vào Cài đặt › Chung › Ngôn ngữ; tiếng Anh, tiếng Trung giữ nguyên.
    - id: aris-ui-locale-vi
      name: '@aris/ui-locale-vi'

    - id: aris-ui-sidebar
      name: '@aris/ui-sidebar'

    # Đầu khung chat "Bot / Phiên ▾": cắm thêm vào slot đầu khung của dsh.
    - id: aris-ui-chat-header
      name: '@aris/ui-chat-header'

    # Thử nghiệm giai đoạn 0: trang "Bản đồ đội".
    - id: aris-web-spike
      name: '@aris/web-spike'
