<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>aris · Phụ kiện linh vật · 3D</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Lexend:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-light{--bg:#F6F5F2;--panel:#FFFFFF;--ink:#16171B;--muted:#5C616C;--line:#E4E2DC;--accent:#1D6FE0}
.t-dark{--bg:#0F1013;--panel:#17191E;--ink:#EDEEF1;--muted:#9CA3B0;--line:#2A2D35;--accent:#5AA5FF}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;pointer-events:none;white-space:nowrap}
.tag b{font-family:'Lexend',sans-serif;font-size:13px;font-weight:600}
.tag span{font-size:11px;color:var(--muted)}
</style>
</helmet>
<div class="{{themeClass}}" data-acc3d="1" style="width: 1440px; height: 640px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: flex-end; gap: 16px; padding: 28px 36px 8px">
    <div>
      <div style="font-family: 'Lexend', sans-serif; font-size: 30px; font-weight: 600; letter-spacing: -0.02em">Phụ kiện linh vật · 3D</div>
      <div style="font-size: 14px; color: var(--muted)">Văn phòng 3D dùng cùng phụ kiện. Kéo để xoay.</div>
    </div>
    <button type="button" onClick="{{toggleTheme}}" style="margin-left: auto; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-size: 13px">{{themeLabel}}</button>
  </div>
  <div data-stage="1" style="flex: 1; min-height: 0; position: relative; overflow: hidden">
    <canvas style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none" aria-label="Đội bot 3D đeo phụ kiện"></canvas>
    <div data-tags="1" style="position: absolute; inset: 0; pointer-events: none"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = (this.state && this.state.theme) || this.props.theme || 'light';
    return { themeClass: 't-' + theme, themeLabel: theme === 'dark' ? 'Xem nền sáng' : 'Xem nền tối', toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }) };
  }
  componentDidMount() {
    this.alive = true;
    import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js').then((T) => { if (this.alive) this.build(T, document.querySelector('[data-acc3d]')); });
  }
  componentWillUnmount() { this.alive = false; cancelAnimationFrame(this.raf); if (this.ren) this.ren.dispose(); }
  build(T, el) {
    const TEAM = [{"name": "Aris", "role": "Chỉ huy", "color": "#1084FE", "acc": "vuong-mien", "label": "Vương miện"}, {"name": "Minh", "role": "Nghiên cứu", "color": "#00B5A5", "acc": "kinh", "label": "Kính tròn"}, {"name": "Thơ", "role": "Nội dung", "color": "#FF309C", "acc": "mu-noi", "label": "Mũ nồi"}, {"name": "Phát", "role": "Bán hàng và chăm khách", "color": "#FF4D5A", "acc": "ca-vat", "label": "Cà vạt"}, {"name": "An", "role": "Thư ký", "color": "#FF6700", "acc": "tai-nghe-mic", "label": "Tai nghe có mic"}, {"name": "Ngân", "role": "Tài chính", "color": "#FFAA00", "acc": "may-tinh", "label": "Máy tính bỏ túi"}, {"name": "Khoa", "role": "Kỹ thuật", "color": "#00C972", "acc": "mu-luoi-trai", "label": "Mũ lưỡi trai"}, {"name": "Kiệt", "role": "Bot ngoài · Claude Code", "color": "#64748B", "acc": "mu-bao-ho", "label": "Mũ bảo hộ"}, {"name": "Lan", "role": "Bot ngoài · Codex", "color": "#EC4899", "acc": "mu-len", "label": "Mũ len"}, {"name": "Thủ thư", "role": "Giữ bộ não", "color": "#0891B2", "acc": "kinh-doc", "label": "Kính đọc sách"}];
    const cv = el.querySelector('canvas'); const stage = el.querySelector('[data-stage]'); const tags = el.querySelector('[data-tags]');
    const ren = new T.WebGLRenderer({ canvas: cv, antialias: true }); this.ren = ren;
    ren.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); ren.shadowMap.enabled = true; ren.shadowMap.type = T.PCFSoftShadowMap;
    const scene = new T.Scene(); const cam = new T.PerspectiveCamera(30, 1, 0.1, 100);
    cam.position.set(0, 2.6, 10.8); cam.lookAt(0, 0.95, 0);
    const hemi = new T.HemisphereLight(0xffffff, 0x444444, 1.1); scene.add(hemi);
    const sun = new T.DirectionalLight(0xffffff, 1.5); sun.position.set(-5, 10, 8); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
    Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 6, bottom: -6 }); scene.add(sun);
    const mat = (c, o = {}) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.55 }, o));
    const floorM = mat(0xe9e4da, { roughness: 0.9 });
    const floor = new T.Mesh(new T.CircleGeometry(11, 64), floorM); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const INK = mat(0x16171b), GOLD = mat(0xffaa00, { metalness: 0.3, roughness: 0.35 });
    const add = (g, geo, m, x, y, z, rx = 0, ry = 0, rz = 0) => { const o = new T.Mesh(geo, m); o.position.set(x, y, z); o.rotation.set(rx, ry, rz); o.castShadow = true; g.add(o); return o; };
    // Phụ kiện 3D: thân capsule cao ~1,3, mắt ở y 0,85, mặt trước z 0,42.
    const ACC = {
      'vuong-mien': (g) => { add(g, new T.CylinderGeometry(0.24, 0.22, 0.14, 20, 1, true), GOLD, 0, 1.36, 0); for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; add(g, new T.ConeGeometry(0.06, 0.16, 8), GOLD, Math.sin(a) * 0.23, 1.5, Math.cos(a) * 0.23); } },
      'kinh': (g) => { for (const x of [-0.15, 0.15]) add(g, new T.TorusGeometry(0.13, 0.022, 10, 28), INK, x, 0.85, 0.47); add(g, new T.CylinderGeometry(0.015, 0.015, 0.06, 8), INK, 0, 0.87, 0.47, 0, 0, Math.PI / 2); },
      'kinh-doc': (g) => { const m = mat(0xb45309); for (const x of [-0.15, 0.15]) add(g, new T.TorusGeometry(0.11, 0.02, 10, 20, Math.PI), m, x, 0.82, 0.47, 0, 0, Math.PI); add(g, new T.CylinderGeometry(0.014, 0.014, 0.08, 8), m, 0, 0.82, 0.47, 0, 0, Math.PI / 2); },
      'mu-noi': (g, c = 0x6d28d9) => { const b = add(g, new T.SphereGeometry(0.4, 24, 12), mat(c), 0.04, 1.3, 0, 0, 0, -0.18); b.scale.set(1, 0.32, 1); add(g, new T.CylinderGeometry(0.02, 0.03, 0.1, 8), mat(c), 0.02, 1.45, 0); },
      'ca-vat': (g) => { const m = mat(0x1e3a8a); add(g, new T.BoxGeometry(0.1, 0.08, 0.04), m, 0, 0.62, 0.41); const b = add(g, new T.ConeGeometry(0.1, 0.42, 4), m, 0, 0.38, 0.41, Math.PI, Math.PI / 4, 0); b.scale.set(1, 1, 0.25); },
      'tai-nghe-mic': (g) => { add(g, new T.TorusGeometry(0.45, 0.035, 10, 32, Math.PI), INK, 0, 0.88, 0); for (const x of [-0.45, 0.45]) add(g, new T.CylinderGeometry(0.11, 0.11, 0.08, 20), INK, x, 0.85, 0, 0, 0, Math.PI / 2); add(g, new T.CylinderGeometry(0.014, 0.014, 0.42, 8), INK, -0.32, 0.67, 0.25, 0.9, 0.6, 0); add(g, new T.SphereGeometry(0.04, 10, 8), INK, -0.18, 0.55, 0.42); },
      'may-tinh': (g) => { const c = new T.Group(); add(c, new T.BoxGeometry(0.26, 0.36, 0.05), mat(0x2a2d35), 0, 0, 0); add(c, new T.BoxGeometry(0.18, 0.07, 0.01), new T.MeshBasicMaterial({ color: 0x9be3b5 }), 0, 0.1, 0.03); for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) add(c, new T.BoxGeometry(0.04, 0.04, 0.01), mat(0xc9ced6), -0.06 + i * 0.06, -0.02 - j * 0.055, 0.03); c.position.set(0.42, 0.5, 0.28); c.rotation.set(-0.2, -0.5, 0.15); g.add(c); },
      'mu-luoi-trai': (g, c = 0x1d4ed8) => { add(g, new T.SphereGeometry(0.43, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(c), 0, 1.06, 0); add(g, new T.CylinderGeometry(0.26, 0.26, 0.03, 24, 1, false, -Math.PI / 2, Math.PI), mat(c), 0, 1.07, 0.36); },
      'mu-bao-ho': (g) => { const y = mat(0xfacc15); add(g, new T.SphereGeometry(0.45, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), y, 0, 1.05, 0); add(g, new T.CylinderGeometry(0.58, 0.58, 0.04, 32), mat(0xeab308), 0, 1.06, 0.04); add(g, new T.BoxGeometry(0.06, 0.06, 0.8), mat(0xeab308), 0, 1.42, 0, 0, 0, 0); },
      'mu-len': (g, c = 0x2563eb) => { add(g, new T.SphereGeometry(0.44, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), mat(c, { roughness: 0.95 }), 0, 1.04, 0); add(g, new T.TorusGeometry(0.43, 0.07, 10, 32), mat(c, { roughness: 0.95 }), 0, 1.06, 0, Math.PI / 2); add(g, new T.SphereGeometry(0.11, 14, 10), mat(0xffffff, { roughness: 1 }), 0, 1.52, 0); },
    };
    const bots = []; const root = new T.Group(); scene.add(root);
    TEAM.forEach((b, i) => {
      const g = new T.Group(); const x = (i - 4.5) * 1.3; g.position.set(x, 0, -Math.abs(x) * 0.12);
      const s = i === 0 ? 1.12 : 1;
      const body = new T.Mesh(new T.CapsuleGeometry(0.42, 0.45, 8, 20), mat(new T.Color(b.color), { roughness: 0.5 })); body.position.y = 0.66; body.castShadow = true; g.add(body);
      const eyeM = new T.MeshBasicMaterial({ color: 0xffffff }), pupM = new T.MeshBasicMaterial({ color: 0x16171b });
      for (const ex of [-0.15, 0.15]) { add(g, new T.SphereGeometry(0.1, 12, 10), eyeM, ex, 0.85, 0.36); add(g, new T.SphereGeometry(0.05, 10, 8), pupM, ex, 0.85, 0.45); }
      (ACC[b.acc] || (() => {}))(g);
      g.scale.setScalar(s); root.add(g);
      const tag = document.createElement('div'); tag.className = 'tag'; tag.innerHTML = '<b>' + b.name + '</b><span>' + b.label + '</span>'; tags.appendChild(tag);
      bots.push({ g, tag, ph: i * 0.7 });
    });
    // Kéo để xoay từng bot quanh mình; không kéo thì tự xoay chậm (tắt khi giảm chuyển động).
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let yaw = 0, drag = null;
    cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, yaw }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
    cv.addEventListener('pointermove', (e) => { if (drag) yaw = drag.yaw + (e.clientX - drag.x) * 0.01; });
    cv.addEventListener('pointerup', () => { drag = null; cv.style.cursor = 'grab'; });
    const v = new T.Vector3();
    const tick = (t) => {
      if (!this.alive) return;
      const w = stage.clientWidth, h = stage.clientHeight;
      if (cv.width !== Math.floor(w * ren.getPixelRatio())) { ren.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
      const dark = el.classList.contains('t-dark');
      scene.background = new T.Color(dark ? 0x0f1013 : 0xf6f5f2); floorM.color.set(dark ? 0x1c1e24 : 0xe9e4da);
      hemi.intensity = dark ? 0.6 : 1.1; sun.intensity = dark ? 0.9 : 1.5;
      if (!drag && !still) yaw += 0.004;
      bots.forEach((b) => {
        b.g.rotation.y = Math.sin(yaw * 1.6 + b.ph * 0.3) * 0.9;
        if (!still) b.g.position.y = Math.abs(Math.sin(t / 420 + b.ph)) * 0.06;
        b.g.getWorldPosition(v); v.y -= 0.12; v.project(cam);
        b.tag.style.transform = 'translate(-50%,0) translate(' + ((v.x + 1) / 2 * w).toFixed(1) + 'px,' + ((1 - v.y) / 2 * h).toFixed(1) + 'px)';
      });
      ren.render(scene, cam); this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
}
</script>
</body>
</html>
