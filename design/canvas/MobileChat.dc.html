<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>aris · Chat trên điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Lexend:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
h1,h2{font-family:'Lexend',sans-serif;letter-spacing:-.01em}
.t-light{--bg:#F6F5F2;--panel:#FFFFFF;--panel2:#F0EFEB;--hover:#EAE9E4;--ink:#16171B;--muted:#5C616C;--line:#E4E2DC;--accent:#1D6FE0;--accentSoft:#E6F0FE;--ok:#15803D;--warn:#B45309;--warnSoft:#FCEFDF}
.t-dark{--bg:#0F1013;--panel:#17191E;--panel2:#1E2127;--hover:#252830;--ink:#EDEEF1;--muted:#9CA3B0;--line:#2A2D35;--accent:#5AA5FF;--accentSoft:#16263F;--ok:#4ADE9B;--warn:#F5A35C;--warnSoft:#3A2614}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ib{width:44px;height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;font-size:11px;color:var(--muted);padding:6px 0;position:relative}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Be Vietnam Pro', system-ui, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; font-size: 15px; line-height: 1.45">
  <div style="height: 56px; display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1px solid var(--line); background: var(--panel)">
    <button type="button" class="ib" aria-label="Mở menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
    <button type="button" style="display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 4px">
      <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M50 6C57 6 62 24 72 32C82 40 94 42 94 50C94 58 82 60 72 68C62 76 57 94 50 94C43 94 38 76 28 68C18 60 6 58 6 50C6 42 18 40 28 32C38 24 43 6 50 6Z" fill="#1084FE"></path><path d="M51 41L48 53M62 39L59 51" stroke="#fff" stroke-width="8" stroke-linecap="round"></path></svg>
      <span style="display: flex; flex-direction: column; text-align: left; min-width: 0"><span style="display: inline-flex; align-items: center; gap: 6px"><b style="font-size: 14.5px">Aris</b><span style="font-size: 10.5px; font-weight: 600; color: var(--accent); background: var(--accentSoft); border-radius: 999px; padding: 0 7px; line-height: 16px">Commander</span></span><span style="font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px">Phiên: Đối thủ và lịch họp ▾</span></span>
    </button>
    <button type="button" class="ib" aria-label="Phiên mới với Aris" style="margin-left: auto"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h8"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
    <button type="button" class="ib" onClick="{{toggleTheme}}" aria-label="Đổi giao diện sáng/tối"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
  </div>

  <div style="flex: 1; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end">
    <div style="align-self: flex-end; max-width: 85%; background: var(--panel2); padding: 9px 13px; border-radius: 16px 16px 4px 16px">Tóm tắt 3 đối thủ rồi xếp lịch họp thứ 5 nhé</div>
    <div>Em giao cho Lâm và Mai, xong em tổng hợp.</div>
    <div style="border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 14px">
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px"><svg width="20" height="20" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M50 14C54 14 57 16 61 19L87 41C92 45.5 92 54.5 87 59L61 81C57 84 54 86 50 86C46 86 43 84 39 81L13 59C8 54.5 8 45.5 13 41L39 19C43 16 46 14 50 14Z" fill="#00B5A5"></path><circle cx="44" cy="48" r="7.5" fill="#fff"></circle><circle cx="59" cy="46" r="5.5" fill="#fff"></circle></svg><span style="flex: 1">Lâm · nghiên cứu</span><span style="font-size: 12px; color: var(--muted)">12/20</span></div>
      <div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line)"><svg width="20" height="20" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M55 8C59 8 63 16 71 28C79 40 86 50 86 64C86 80 72 92 54 92C36 92 20 80 20 64C20 48 34 34 44 20C48 14 51 8 55 8Z" fill="#FF6700"></path><path d="M47 55L43 65M59 53L55 63" stroke="#fff" stroke-width="7.5" stroke-linecap="round"></path></svg><span style="flex: 1">Mai · lời mời họp</span><button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: var(--ink); color: var(--panel); font-size: 12.5px; font-weight: 600">Duyệt</button></div>
    </div>
  </div>

  <div style="padding: 6px 10px 8px">
    <div style="border: 1px solid var(--line); background: var(--panel); border-radius: 18px; padding: 8px 8px 6px 12px">
      <label style="display: flex"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nhắn Aris</span><textarea rows="1" placeholder="Nhắn Aris…" style="flex: 1; resize: none; border: 0; background: transparent; color: var(--ink); font: inherit; outline: none"></textarea></label>
      <div style="display: flex; align-items: center; gap: 2px">
        <button type="button" class="ib" aria-label="Đính kèm" style="width: 38px; height: 38px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.1l-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"></path></svg></button>
        <button type="button" class="ib" aria-label="Lệnh" style="width: 38px; height: 38px; font-family: 'JetBrains Mono', monospace; font-weight: 600">/</button>
        <button type="button" class="ib" aria-label="Gọi bot" style="width: 38px; height: 38px; font-weight: 600">@</button>
        <span style="flex: 1"></span>
        <button type="button" style="height: 30px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); padding: 0 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 5px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #4D6BFE"></span>deepseek-chat ▾</button>
        <button type="button" aria-label="Ghi âm hoặc gửi" style="width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--ink); color: var(--panel); display: inline-flex; align-items: center; justify-content: center; margin-left: 4px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v4"></path></svg></button>
      </div>
    </div>
  </div>

  <nav aria-label="Điều hướng chính" style="display: flex; border-top: 1px solid var(--line); background: var(--panel); padding-bottom: 14px">
    <button type="button" class="tab" style="color: var(--ink); font-weight: 600" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Chat</button>
    <button type="button" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><circle cx="4" cy="6" r="2"></circle><circle cx="20" cy="6" r="2"></circle><circle cx="12" cy="21" r="2"></circle><path d="M6 7l4 3M18 7l-4 3M12 15v4"></path></svg>Đội bot</button>
    <button type="button" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path></svg>Brain</button>
    <button type="button" class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.5 5.1L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"></path></svg>Duyệt<span style="position: absolute; top: 2px; left: 54%; min-width: 16px; height: 16px; border-radius: 99px; background: var(--warn); color: #fff; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">3</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = (this.state && this.state.theme) || this.props.theme || 'light';
    return { themeClass: 't-' + theme, toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }) };
  }
}
</script>
</body>
</html>
