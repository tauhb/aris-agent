<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>aris · Tạo phòng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Lexend:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
h1,h2{font-family:'Lexend',sans-serif;letter-spacing:-.01em}
.t-light{--bg:#F6F5F2;--panel:#FFFFFF;--panel2:#F0EFEB;--hover:#EAE9E4;--ink:#16171B;--muted:#5C616C;--line:#E4E2DC;--accent:#1D6FE0;--accentSoft:#E6F0FE;--ok:#15803D;--okSoft:#E2F3E9;--warn:#B45309;--warnSoft:#FCEFDF;--shadow:0 24px 60px rgba(20,23,28,.22),0 2px 6px rgba(20,23,28,.08);--scrim:rgba(20,23,28,.35)}
.t-dark{--bg:#0F1013;--panel:#17191E;--panel2:#1E2127;--hover:#252830;--ink:#EDEEF1;--muted:#9CA3B0;--line:#2A2D35;--accent:#5AA5FF;--accentSoft:#16263F;--ok:#4ADE9B;--okSoft:#15302A;--warn:#F5A35C;--warnSoft:#3A2614;--shadow:0 24px 60px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.3);--scrim:rgba(0,0,0,.55)}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b1{height:38px;padding:0 16px;border:0;border-radius:10px;background:var(--ink);color:var(--panel);font-size:13.5px;font-weight:600}
.b2{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font-size:13.5px}
.lb{font-size:12.5px;font-weight:600;color:var(--ink)}
.m{color:var(--muted)}
.mono{font-family:'JetBrains Mono',monospace}
.inp{height:38px;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;font-size:14px;padding:0 12px;width:100%}
.chip{height:34px;border:1px solid var(--line);border-radius:999px;background:var(--panel);padding:0 12px 0 8px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 1440px; height: 900px; position: relative; background: var(--bg); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px; line-height: 1.5; display: flex; overflow: hidden">
  <dc-import name="Sidebar" active="none" bot="none" hint-size="260px,900px"></dc-import>
  <div style="flex: 1"></div>

  <div style="position: absolute; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center">
    <div role="dialog" aria-modal="true" aria-labelledby="tp-title" style="width: 620px; max-height: 820px; overflow: auto; background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; padding: 18px 22px 6px">
        <h2 id="tp-title" style="margin: 0; font-size: 19px">Tạo phòng</h2>
        <button type="button" onClick="{{toggleTheme}}" class="b2" style="margin-left: auto; height: 32px; font-size: 12.5px">{{themeLabel}}</button>
        <button type="button" aria-label="Đóng" style="margin-left: 6px; width: 34px; height: 34px; border: 0; border-radius: 9px; background: transparent; font-size: 20px; color: var(--muted)">×</button>
      </div>
      <p class="m" style="margin: 0; padding: 0 22px 14px; font-size: 13px">Phòng là nơi vài bot cùng làm một việc, có thư mục làm việc riêng.</p>

      <div style="display: flex; flex-direction: column; gap: 14px; padding: 4px 22px 8px">
        <label style="display: flex; flex-direction: column; gap: 6px"><span class="lb">Tên phòng</span><input class="inp" value="Ra mắt khoá học AI"></label>
        <div>
          <div class="lb" style="padding-bottom: 6px">Thành viên <span class="m" style="font-weight: 400">· {{count}} bot</span></div>
          <div role="group" aria-label="Chọn bot vào phòng" style="display: flex; flex-wrap: wrap; gap: 6px">
              <button type="button" role="checkbox" aria-checked="{{ck.aris}}" onClick="{{tg.aris}}" class="chip" style="{{cs.aris}}"><svg width="18" height="18" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M50 6C57 6 62 24 72 32C82 40 94 42 94 50C94 58 82 60 72 68C62 76 57 94 50 94C43 94 38 76 28 68C18 60 6 58 6 50C6 42 18 40 28 32C38 24 43 6 50 6Z" fill="#1084FE"></path><path d="M51 41L48 53M62 39L59 51" stroke="#fff" stroke-width="8" stroke-linecap="round"></path></svg>Aris <span class="m" style="font-size: 11.5px; font-weight: 400">chủ trì</span></button>
              <button type="button" role="checkbox" aria-checked="{{ck.lam}}" onClick="{{tg.lam}}" class="chip" style="{{cs.lam}}"><svg width="18" height="18" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M50 14C54 14 57 16 61 19L87 41C92 45.5 92 54.5 87 59L61 81C57 84 54 86 50 86C46 86 43 84 39 81L13 59C8 54.5 8 45.5 13 41L39 19C43 16 46 14 50 14Z" fill="#00B5A5"></path><circle cx="44" cy="48" r="7.5" fill="#fff"></circle><circle cx="59" cy="46" r="5.5" fill="#fff"></circle></svg>Lâm</button>
              <button type="button" role="checkbox" aria-checked="{{ck.tin}}" onClick="{{tg.tin}}" class="chip" style="{{cs.tin}}"><svg width="18" height="18" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M50 10C53 10 55 11 58 13L86 33C90 36 92 41 90 46L80 80C78 86 74 90 68 90H32C26 90 22 86 20 80L10 46C8 41 10 36 14 33L42 13C45 11 47 10 50 10Z" fill="#FFAA00"></path><path d="M47 41L43 53M59 39L55 51" stroke="#fff" stroke-width="8" stroke-linecap="round"></path></svg>Tín</button>
              <button type="button" role="checkbox" aria-checked="{{ck.mai}}" onClick="{{tg.mai}}" class="chip" style="{{cs.mai}}"><svg width="18" height="18" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M55 8C59 8 63 16 71 28C79 40 86 50 86 64C86 80 72 92 54 92C36 92 20 80 20 64C20 48 34 34 44 20C48 14 51 8 55 8Z" fill="#FF6700"></path><path d="M47 55L43 65M59 53L55 63" stroke="#fff" stroke-width="7.5" stroke-linecap="round"></path></svg>Mai</button>
              <button type="button" role="checkbox" aria-checked="{{ck.ha}}" onClick="{{tg.ha}}" class="chip" style="{{cs.ha}}"><svg width="18" height="18" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M50 88C40 80 12 62 10 40C8 24 20 14 32 14C42 14 48 20 50 26C52 20 58 14 68 14C80 14 92 24 90 40C88 62 60 80 50 88Z" fill="#FF309C"></path><path d="M52 40L49 52M63 38L60 50" stroke="#fff" stroke-width="8" stroke-linecap="round"></path></svg>Hạ</button>
              <button type="button" role="checkbox" aria-checked="{{ck.dev}}" onClick="{{tg.dev}}" class="chip" style="{{cs.dev}}"><svg width="18" height="18" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M50 12C80 12 88 20 88 50C88 80 80 88 50 88C20 88 12 80 12 50C12 20 20 12 50 12Z" fill="#00C972"></path><circle cx="52" cy="52" r="8" fill="#fff"></circle><circle cx="66" cy="44" r="6" fill="#fff"></circle></svg>Dev</button>
              <button type="button" role="checkbox" aria-checked="{{ck.banh-rang}}" onClick="{{tg.banh-rang}}" class="chip" style="{{cs.banh-rang}}"><svg width="18" height="18" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><g fill="#64748B"><circle cx="50" cy="50" r="32"></circle><rect x="40" y="6" width="20" height="22" rx="6"></rect><rect x="40" y="6" width="20" height="22" rx="6" transform="rotate(45 50 50)"></rect><rect x="40" y="6" width="20" height="22" rx="6" transform="rotate(90 50 50)"></rect><rect x="40" y="6" width="20" height="22" rx="6" transform="rotate(135 50 50)"></rect><rect x="40" y="6" width="20" height="22" rx="6" transform="rotate(180 50 50)"></rect><rect x="40" y="6" width="20" height="22" rx="6" transform="rotate(225 50 50)"></rect><rect x="40" y="6" width="20" height="22" rx="6" transform="rotate(270 50 50)"></rect><rect x="40" y="6" width="20" height="22" rx="6" transform="rotate(315 50 50)"></rect></g><circle cx="43" cy="51" r="7" fill="#fff"></circle><circle cx="59" cy="48" r="5" fill="#fff"></circle></svg>Khoa <span class="m" style="font-size: 11.5px; font-weight: 400">bot ngoài</span></button>
          </div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 6px"><span class="lb">Thư mục làm việc</span><span style="display: flex; gap: 8px"><input class="inp mono" style="font-size: 13px" value="~/Projects/khoa-hoc-ai"><button type="button" class="b2" style="flex: none">Chọn…</button></span><span class="m" style="font-size: 12px">Bot trong phòng đọc và ghi tệp ở đây. Chưa có thì aris tạo mới.</span></label>
        <label style="display: flex; flex-direction: column; gap: 6px"><span class="lb">Mục tiêu của phòng <span class="m" style="font-weight: 400">· không bắt buộc</span></span><textarea rows="2" style="box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); font: inherit; font-size: 14px; padding: 9px 12px; resize: vertical">Lên kế hoạch ra mắt khoá học AI trong tháng 11: nội dung, giá, lịch quảng bá.</textarea></label>
      </div>

      <div style="margin: 6px 22px 0; border-top: 1px solid var(--line)">
        <button type="button" onClick="{{toggleAdv}}" aria-expanded="{{advStr}}" style="width: 100%; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 12px 0; font-size: 13.5px; font-weight: 600; text-align: left">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="{{chev}}"></path></svg>Nâng cao
          <span class="m" style="font-weight: 400; font-size: 12.5px">luật trò chuyện của phòng</span>
        </button>
        <sc-if value="{{adv}}" hint-placeholder-val="{{ false }}">
          <div style="padding-bottom: 6px">
            <div class="row"><span>Số vòng tối đa mỗi tin của anh</span><span class="m">3</span></div>
            <div class="row"><span>Số tin tối đa mỗi lượt</span><span class="m">10</span></div>
            <label class="row" style="cursor: pointer"><span>Hiểu lệnh "dừng @bot"</span><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--accent)"></label>
            <label class="row" style="cursor: pointer"><span>Aris chủ trì và tổng hợp cuối mỗi vòng</span><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: var(--accent)"></label>
          </div>
        </sc-if>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 18px; border-top: 1px solid var(--line)">
        <button type="button" class="b2">Huỷ</button>
        <button type="button" class="b1">Tạo phòng</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const theme = s.theme || this.props.theme || 'light';
    const adv = !!s.adv;
    const pick = Object.assign({ aris: true, lam: true, tin: false, mai: true, ha: true, dev: false, 'banh-rang': false }, s.pick || {});
    const on = 'border-color: var(--accent); color: var(--accent); background: var(--accentSoft); font-weight: 600';
    const ck = {}, cs = {}, tg = {};
    Object.keys(pick).forEach((k) => {
      ck[k] = pick[k] ? 'true' : 'false';
      cs[k] = pick[k] ? on : '';
      // Aris luôn ở trong phòng để chủ trì.
      tg[k] = k === 'aris' ? () => {} : () => this.setState({ pick: Object.assign({}, pick, { [k]: !pick[k] }) });
    });
    return {
      themeClass: 't-' + theme,
      themeLabel: theme === 'dark' ? 'Sáng' : 'Tối',
      ck, cs, tg,
      count: Object.values(pick).filter(Boolean).length,
      adv, advStr: adv ? 'true' : 'false',
      chev: adv ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6',
      toggleAdv: () => this.setState({ adv: !adv }),
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' })
    };
  }
}
</script>
</body>
</html>
