<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Hộp thư chung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t-light{--bg:#F6F5F2;--panel:#FFFFFF;--panel2:#F0EFEB;--hover:#EAE9E4;--ink:#16171B;--muted:#5C616C;--line:#E4E2DC;--accent:#1D6FE0;--accentSoft:#E6F0FE;--ok:#15803D;--okSoft:#E2F3E9;--warn:#A14A07;--warnSoft:#FCEFDF;--violet:#6D28D9;--violetSoft:#EFE7FD}
.t-dark{--bg:#0F1013;--panel:#17191E;--panel2:#1E2127;--hover:#252830;--ink:#EDEEF1;--muted:#9CA3B0;--line:#2A2D35;--accent:#5AA5FF;--accentSoft:#16263F;--ok:#4ADE9B;--okSoft:#15302A;--warn:#F5A35C;--warnSoft:#3A2614;--violet:#C4B5FD;--violetSoft:#2A2145}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit}
a{color:var(--accent)}a:hover{color:var(--ink)}
</style>
</helmet>
<div class="{{themeClass}}" style="background: var(--bg); color: var(--ink); font-family: 'Be Vietnam Pro', system-ui, sans-serif; font-size: 14px; line-height: 1.5; min-height: 900px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 16px; padding: 12px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap">
    <span style="display: flex; flex-direction: column"><b style="font-size: 16px">Hộp thư chung</b><span style="font-size: 12px; color: var(--muted)">Mọi cuộc chat với khách trên Zalo và Telegram</span></span>
    <span style="display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; font-size: 12.5px; color: var(--muted)"><span>Hôm nay <b style="color: var(--ink); font-size: 14px">[SỐ]</b> cuộc chat</span><span>Trả lời trung bình <b style="color: var(--ink); font-size: 14px">[THỜI GIAN]</b></span><span>AI tự xử lý <b style="color: var(--ink); font-size: 14px">[TỈ LỆ]</b></span></span>
    <button type="button" onClick="{{toggleTheme}}" aria-label="Đổi giao diện sáng/tối" style="width: 44px; height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
  </div>
  <div style="flex: 1; display: flex; flex-wrap: wrap; min-height: 0">
    <section aria-label="Danh sách cuộc chat" style="flex: 1 1 380px; max-width: 460px; min-width: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column">
      <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line)">
        <input aria-label="Tìm cuộc chat" placeholder="Tìm tên khách, nội dung…" style="height: 40px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink); padding: 0 10px; font-size: 13.5px">
        <span style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{filters}}" as="f" hint-placeholder-count="5"><button type="button" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">{{f.name}} <span style="color: var(--muted); font-weight: 400">{{f.n}}</span></button></sc-for></span>
        <span style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted)"><span>Tài khoản: <b style="color: var(--ink)">Tất cả</b> ▾</span><span>Bot: <b style="color: var(--ink)">Tất cả</b> ▾</span></span>
      </div>
      <sc-for list="{{chats}}" as="c" hint-placeholder-count="6">
        <button type="button" onClick="{{c.pick}}" style="{{c.rowStyle}}"><span aria-hidden="true" style="flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--panel2); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px">{{c.initial}}</span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="display: flex; gap: 6px; align-items: baseline"><b style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.name}}</b><span style="margin-left: auto; font-size: 11.5px; color: var(--muted); flex: none">{{c.at}}</span></span><span style="font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{c.last}}</span><span style="display: flex; gap: 6px; align-items: center; padding-top: 2px"><span style="{{c.stStyle}}">{{c.st}}</span><span style="font-size: 11.5px; color: var(--muted)">{{c.where}}</span></span></span></button>
      </sc-for>
    </section>
    <section aria-label="Cuộc chat" style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column">
      <div style="padding: 12px 18px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap"><span style="display: flex; flex-direction: column; flex: 1; min-width: 180px"><b>{{cur.name}}</b><span style="font-size: 12.5px; color: var(--muted)">{{cur.where}} · bot {{cur.bot}}</span></span><span style="{{cur.stStyle}}">{{cur.st}}</span><button type="button" onClick="{{takeOver}}" style="height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); font-size: 13px">{{takeLabel}}</button><button type="button" onClick="{{closeChat}}" style="height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); font-size: 13px">Đóng</button></div>
      <div style="flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto">
        <sc-for list="{{msgs}}" as="m" hint-placeholder-count="4"><div style="{{m.wrap}}"><span style="font-size: 11.5px; color: var(--muted)">{{m.who}}</span><div style="{{m.bubble}}">{{m.text}}</div></div></sc-for>
      </div>
      <sc-if value="{{hasDraft}}" hint-placeholder-val="{{ true }}">
      <div style="margin: 0 18px 10px; border: 1px solid var(--violet); background: var(--violetSoft); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12.5px; font-weight: 600; color: var(--violet)">Nháp của Mai · chờ duyệt</span>
        <textarea aria-label="Nháp trả lời" rows="2" style="border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink); padding: 8px 10px; font-size: 13.5px; resize: vertical">Dạ chị, đơn của chị đã giao cho bên vận chuyển hôm qua, dự kiến tới trong 2 ngày ạ. Mã vận đơn em gửi kèm bên dưới.</textarea>
        <span style="display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap"><button type="button" onClick="{{dropDraft}}" style="height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); font-size: 13px">Bỏ</button><button type="button" style="height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); font-size: 13px">Soạn lại</button><button type="button" onClick="{{sendDraft}}" style="height: 40px; padding: 0 16px; border: 0; border-radius: 9px; background: var(--ink); color: var(--panel); font-size: 13px; font-weight: 600">Gửi</button></span>
      </div>
      </sc-if>
      <div style="padding: 10px 18px 16px; display: flex; gap: 8px; border-top: 1px solid var(--line); flex-wrap: wrap"><input aria-label="Nhắn khách" placeholder="Nhắn khách (gửi bằng tài khoản {{cur.account}})…" style="flex: 1 1 240px; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 0 12px; font-size: 13.5px"><button type="button" onClick="{{askDraft}}" style="height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 13px">AI soạn nháp</button><button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--ink); color: var(--panel); font-size: 13px; font-weight: 600">Gửi</button></div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const theme = s.theme || this.props.theme || 'dark';
    const filter = s.filter || 'all';
    const sel = s.sel ?? 1;
    const stOver = s.stOver || {};
    const draft = s.draft || {};
    const tone = { ai: ['AI', 'var(--accent)', 'var(--accentSoft)'], human: ['Người', 'var(--ok)', 'var(--okSoft)'], wait: ['Chờ', 'var(--warn)', 'var(--warnSoft)'], closed: ['Đóng', 'var(--muted)', 'var(--panel2)'] };
    const pill = (k) => 'font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 0 8px; white-space: nowrap; color: ' + tone[k][1] + '; background: ' + tone[k][2];
    const base = [
      { name: 'Nguyễn Thu Hà', last: 'Khoá AI cơ bản còn suất tháng 11 không ạ?', at: '2 phút', where: 'CSKH 1 · Zalo', account: 'CSKH 1', bot: 'Mai', st: 'ai', draft: false, msgs: [['k', 'Chào shop, khoá AI cơ bản còn suất tháng 11 không ạ?'], ['b', 'Dạ còn ạ, lớp tháng 11 khai giảng ngày 12, còn 6 suất. Chị muốn em giữ chỗ không ạ?']] },
      { name: 'Trần Minh Anh', last: 'Đơn của mình tới đâu rồi shop?', at: '5 phút', where: 'CSKH 1 · Zalo', account: 'CSKH 1', bot: 'Mai', st: 'wait', draft: true, msgs: [['k', 'Shop ơi đơn hôm thứ hai của mình tới đâu rồi?'], ['k', 'Mình cần gấp trước thứ sáu'], ['s', 'Mai đã soạn nháp vì chế độ “AI soạn nháp” đang bật cho cuộc chat này.']] },
      { name: 'Lê Hoàng', last: 'Cho mình gặp nhân viên', at: '12 phút', where: 'CSKH 2 · Zalo', account: 'CSKH 2', bot: 'Mai', st: 'human', draft: false, msgs: [['k', 'Cho mình gặp nhân viên'], ['s', 'Khách gõ “gặp nhân viên”: bot đã im và báo anh Tầu.']] },
      { name: 'Nhóm Lớp AI K12', last: '@Aris bài tập buổi 3 nộp ở đâu?', at: '20 phút', where: 'CSKH 1 · Zalo · nhóm', account: 'CSKH 1', bot: 'Mai', st: 'ai', draft: false, msgs: [['k', '[Phạm Vy] @Aris bài tập buổi 3 nộp ở đâu ạ?'], ['b', 'Bạn nộp ở thư mục Bài tập trên Drive của lớp nhé, hạn 23:59 thứ năm.']] },
      { name: 'Võ Thanh Tùng', last: 'Ok cảm ơn shop', at: '1 giờ', where: '@mai_cskh_bot · Telegram', account: '@mai_cskh_bot', bot: 'Mai', st: 'closed', draft: false, msgs: [['b', 'Dạ, link thanh toán đây ạ.'], ['k', 'Ok cảm ơn shop']] },
    ].map((c, i) => ({ ...c, st: stOver[i] || c.st, draft: draft[i] ?? c.draft }));
    const counts = { all: base.length, ai: 0, human: 0, wait: 0, closed: 0 };
    base.forEach((c) => counts[c.st]++);
    const shown = base.map((c, i) => ({ ...c, i })).filter((c) => filter === 'all' || c.st === filter);
    const cur = base[sel];
    const who = { k: cur.name, b: 'Mai (AI)', s: 'aris' };
    return {
      themeClass: 't-' + theme,
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }),
      filters: [['all', 'Tất cả'], ['ai', 'AI'], ['human', 'Người'], ['wait', 'Chờ'], ['closed', 'Đóng']].map(([k, n]) => ({ name: n, n: counts[k], on: filter === k, pick: () => this.setState({ filter: k }), style: 'min-height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; border: 1px solid ' + (filter === k ? 'var(--accent); background: var(--accentSoft); font-weight: 600' : 'var(--line); background: var(--panel)') })),
      chats: shown.map((c) => ({ ...c, initial: c.name.split(' ').pop()[0], st: tone[c.st][0], stStyle: pill(c.st), pick: () => this.setState({ sel: c.i }), rowStyle: 'width: 100%; display: flex; gap: 10px; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); text-align: left; font-size: 13.5px; ' + (c.i === sel ? 'background: var(--accentSoft)' : 'background: transparent') })),
      cur: { ...cur, st: tone[cur.st][0], stStyle: pill(cur.st) },
      takeLabel: cur.st === 'human' ? 'Trả cho AI' : 'Nhận tay',
      takeOver: () => this.setState({ stOver: { ...stOver, [sel]: cur.st === 'human' ? 'ai' : 'human' } }),
      closeChat: () => this.setState({ stOver: { ...stOver, [sel]: 'closed' } }),
      msgs: cur.msgs.map(([w, t]) => ({ who: who[w], text: t, wrap: 'display: flex; flex-direction: column; gap: 2px; max-width: 80%; ' + (w === 'k' ? 'align-self: flex-start' : w === 'b' ? 'align-self: flex-end; align-items: flex-end' : 'align-self: center; align-items: center'), bubble: 'border-radius: 12px; padding: 8px 12px; font-size: 13.5px; ' + (w === 'k' ? 'background: var(--panel2)' : w === 'b' ? 'background: var(--accentSoft)' : 'background: transparent; color: var(--muted); font-size: 12.5px; border: 1px dashed var(--line)') })),
      hasDraft: !!cur.draft,
      askDraft: () => this.setState({ draft: { ...draft, [sel]: true } }),
      dropDraft: () => this.setState({ draft: { ...draft, [sel]: false } }),
      sendDraft: () => this.setState({ draft: { ...draft, [sel]: false }, stOver: { ...stOver, [sel]: 'ai' } }),
    };
  }
}
</script>
</body>
</html>
