<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>V1 · Khung ứng dụng và danh bạ bot</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="gd9.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="wrap">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="mb {{th.cls}}">
<nav class="side" aria-label="Bot">
  <div class="stop"><button type="button" class="ib" aria-label="Tìm"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg></button><button type="button" class="ib" aria-label="Hoạt động, 2 việc cần anh"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span class="n1">2</span></button><button type="button" class="ib" aria-label="Tạo bot, nhóm hay phòng ban"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="tiles">
    <button type="button" class="tile" aria-current="true"><span class="mas"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8Q56 8 60 12L88 40Q92 44 92 50T88 60L60 88Q56 92 50 92T40 88L12 60Q8 56 8 50T12 40L40 12Q44 8 50 8Z"/><ellipse cx="42" cy="50" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="58" cy="50" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Aris</b><span class="l">Đã chia việc sáng nay</span></span></button>
    <div class="grph">Cả công ty<span class="r"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></div>
    <button type="button" class="tile"><span class="mas"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="12" y="12" width="76" height="76" rx="24"/><ellipse cx="41" cy="50" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="50" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Tín</b><span class="l">Báo cáo chi phí tuần</span></span></button>
    <div class="grph">Kinh doanh<span class="r"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></div>
    <button type="button" class="tile"><span class="mas"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="42"/><ellipse cx="41" cy="52" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="52" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Mai</b><span class="l">Cần {{you}} duyệt 5 câu trả lời</span></span><span class="bd">1</span></button>
    <button type="button" class="tile"><span class="mas"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="6" y="26" width="88" height="54" rx="27"/><ellipse cx="41" cy="53" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="53" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Hà</b><span class="l">Đã lọc 214 khách hỏi giá</span></span></button>
    <div class="grph">Nội dung<span class="r"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></div>
    <button type="button" class="tile"><span class="mas"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6C62 28 86 42 86 62A36 36 0 0 1 14 62C14 42 38 28 50 6Z"/><ellipse cx="41" cy="62" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="62" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Lâm</b><span class="l">Đang viết bài 2 trên 3</span></span><span class="bd r" aria-label="Đang làm"></span></button>
    <button type="button" class="tile"><span class="mas"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="6" y="26" width="88" height="54" rx="27"/><ellipse cx="41" cy="53" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="53" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Hà<span class="from">từ Kinh doanh</span></b><span class="l">Chia sẻ để chat</span></span></button>
    <div class="grph">Vận hành<span class="r"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span></div>
    <button type="button" class="tile"><span class="mas"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8L87 29V71L50 92L13 71V29Z" stroke-width="8" stroke-linejoin="round"/><ellipse cx="41" cy="50" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="50" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Dev</b><span class="l">Lỗi đăng nhập GitHub</span></span><span class="bd e">!</span></button>
  </div>
  <div class="foot"><button type="button" class="av" aria-label="Tài khoản" style="box-shadow:0 0 0 2px var(--ink)">T</button><button type="button" class="apps">Kết nối ứng dụng<span class="lgs"><span class="lg">Z</span><span class="lg">T</span><span class="lg">G</span></span></button></div>
</nav>
<main class="main">
  <div class="hd"><button type="button" class="who"><span class="mas"><svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8Q56 8 60 12L88 40Q92 44 92 50T88 60L60 88Q56 92 50 92T40 88L12 60Q8 56 8 50T12 40L40 12Q44 8 50 8Z"/></svg></span>Aris</button>
    <div class="hr"><button type="button" class="mp">DeepSeek V4 Pro<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button type="button" class="ib" aria-label="Máy của Aris"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button></div></div>
  <div class="col">
    <span class="when">Hôm nay 08:12</span>
    <div class="bot"><p>Sáng nay em đã chia việc:</p><p><span class="bm mai"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="42"/></svg>Mai</span> trả lời 41 tin Zalo</p><p><span class="bm lam"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 6C62 28 86 42 86 62A36 36 0 0 1 14 62C14 42 38 28 50 6Z"/></svg>Lâm</span> viết 3 bài Facebook</p><p><span class="bm ha"><svg viewBox="0 0 100 100" aria-hidden="true"><rect x="6" y="26" width="88" height="54" rx="27"/></svg>Hà</span> lọc khách chưa chốt</p></div>
    <div class="user">Hôm nay đội tốn bao nhiêu rồi em?</div>
    <div class="bot"><p>1,84 USD, trần ngày là 5 USD.</p></div>
  </div>
  <div class="comp"><div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span style="flex:1">Nhắn Aris</span><button type="button" class="go" aria-label="Gửi"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></div>
</main>
<div class="menu" style="left:14px;bottom:60px;width:240px" role="menu" aria-label="Tài khoản">
  <span class="mi s3" style="font-size:12.5px">Tầu · 1,84 USD hôm nay</span>
  <button type="button" class="mi" role="menuitem">Bộ não</button>
  <button type="button" class="mi" role="menuitem">Tự học<span class="v">2</span></button>
  <button type="button" class="mi" role="menuitem">Thống kê</button>
  <button type="button" class="mi" role="menuitem">Văn phòng 3D</button>
  <button type="button" class="mi" role="menuitem">Cài đặt</button>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2960,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { you: 'anh Tầu', themes: [{ cls: 't-dark' }, { cls: 't-light' }] };
  }
}
</script>
</body>
</html>
