<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>V5 · Chat khi bot đang làm</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="gd9.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div class="wrap">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="mb {{th.cls}}">
<nav class="side" aria-label="Bot">
  <div class="stop"><button type="button" class="ib" aria-label="Tìm"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg></button><button type="button" class="ib" aria-label="Hoạt động"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></button><button type="button" class="ib" aria-label="Tạo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="tiles">
    <button type="button" class="tile"><span class="mas"><svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="cr" cx="34%" cy="26%" r="82%"><stop offset="0" stop-color="#fff"/><stop offset=".42" stop-color="#c4c4c4"/><stop offset=".78" stop-color="#555"/><stop offset="1" stop-color="#1b1b1b"/></radialGradient></defs><path d="M50 8Q56 8 60 12L88 40Q92 44 92 50T88 60L60 88Q56 92 50 92T40 88L12 60Q8 56 8 50T12 40L40 12Q44 8 50 8Z" fill="url(#cr)"/><ellipse cx="42" cy="50" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="58" cy="50" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Aris</b><span class="l">Đã sửa lời dặn của Mai</span></span></button>
    <button type="button" class="tile"><span class="mas"><svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="cr" cx="34%" cy="26%" r="82%"><stop offset="0" stop-color="#fff"/><stop offset=".42" stop-color="#c4c4c4"/><stop offset=".78" stop-color="#555"/><stop offset="1" stop-color="#1b1b1b"/></radialGradient></defs><circle cx="50" cy="52" r="42" fill="url(#cr)"/><ellipse cx="41" cy="52" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="52" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Mai</b><span class="l">Đã trả lời 41 tin Zalo</span></span></button>
    <button type="button" class="tile" aria-current="true"><span class="mas"><svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="cr" cx="34%" cy="26%" r="82%"><stop offset="0" stop-color="#fff"/><stop offset=".42" stop-color="#c4c4c4"/><stop offset=".78" stop-color="#555"/><stop offset="1" stop-color="#1b1b1b"/></radialGradient></defs><path d="M50 6C62 28 86 42 86 62A36 36 0 0 1 14 62C14 42 38 28 50 6Z" fill="url(#cr)"/><ellipse cx="41" cy="62" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="62" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Lâm</b><span class="l">Đang viết bài 2 trên 3</span></span><span class="bd r" aria-label="Đang làm"></span></button>
    <button type="button" class="tile"><span class="mas"><svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="cr" cx="34%" cy="26%" r="82%"><stop offset="0" stop-color="#fff"/><stop offset=".42" stop-color="#c4c4c4"/><stop offset=".78" stop-color="#555"/><stop offset="1" stop-color="#1b1b1b"/></radialGradient></defs><rect x="6" y="26" width="88" height="54" rx="27" fill="url(#cr)"/><ellipse cx="41" cy="53" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="53" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Hà</b><span class="l">Đã lọc 214 khách hỏi giá</span></span></button>
  </div>
  <div class="foot"><button type="button" class="av" aria-label="Tài khoản">T</button><button type="button" class="apps">Kết nối ứng dụng<span class="lgs"><span class="lg">Z</span><span class="lg">T</span><span class="lg">G</span></span></button></div>
</nav>
<main class="main">
  <div class="hd"><button type="button" class="who"><span class="mas"><svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="cr" cx="34%" cy="26%" r="82%"><stop offset="0" stop-color="#fff"/><stop offset=".42" stop-color="#c4c4c4"/><stop offset=".78" stop-color="#555"/><stop offset="1" stop-color="#1b1b1b"/></radialGradient></defs><path d="M50 6C62 28 86 42 86 62A36 36 0 0 1 14 62C14 42 38 28 50 6Z" fill="url(#cr)"/></svg></span>Lâm</button>
    <div class="hr"><button type="button" class="mp">DeepSeek V4 Pro<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button type="button" class="ib" aria-label="Máy của Lâm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button></div></div>
  <div class="col">
    <div class="topic"><span></span>Chủ đề mới · 10:20<span></span></div>
    <div class="user">Viết 3 bài Facebook cho khoá Kèm cặp.</div>
    <div class="step"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>Đọc tài liệu khoá Kèm cặp</div>
    <div class="step"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4 10-10"/></svg>Bài 1 xong</div>
    <div class="user">Bài 2 nhắc giảm 15% đến 10/11 nhé.</div>
    <div class="bot"><p>Dạ, em thêm vào bài 2 và 3.</p></div>
    <div class="run"><span class="spin"></span>Đang viết bài 2 trên 3</div>
  </div>
  <div class="comp"><div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span style="flex:1">Nhắn Lâm</span><button type="button" class="go" aria-label="Dừng Lâm"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg></button></div></div>
</main>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2960,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { you: 'anh Tầu', themes: [{ cls: 't-dark' }, { cls: 't-light' }] };
  }
}
</script>
</body>
</html>
