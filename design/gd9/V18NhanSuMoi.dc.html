</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">

body{margin:0}
</style>
</helmet>
<div class="wrap">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="2">
<div class="mb {{th.cls}}">
<nav class="side" aria-label="Bot">

  <div class="tiles">
    <button type="button" class="tile" aria-current="true"><span class="mas"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8Q56 8 60 12L88 40Q92 44 92 50T88 60L60 88Q56 92 50 92T40 88L12 60Q8 56 8 50T12 40L40 12Q44 8 50 8Z"/><ellipse cx="42" cy="50" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="58" cy="50" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Aris</b><span class="l">Chào chị Hằng</span></span></button>

    <button type="button" class="tile"><span class="mas"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="42"/><ellipse cx="41" cy="52" rx="4.5" ry="6.5" fill="#111"/><ellipse cx="59" cy="52" rx="4.5" ry="6.5" fill="#111"/></svg></span><span class="tb"><b>Mai</b><span class="l">Chăm sóc khách · của anh Tầu</span></span></button>
  </div>
  <div class="foot"><button type="button" class="av" aria-label="Tài khoản">H</button><button type="button" class="apps">Kết nối ứng dụng<span class="lgs"><span class="lg">Z</span><span class="lg">T</span><span class="lg">G</span></span></button></div>
</nav>
<main class="main">
  <div class="hd"><button type="button" class="who"><span class="mas"><svg width="22" height="22" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8Q56 8 60 12L88 40Q92 44 92 50T88 60L60 88Q56 92 50 92T40 88L12 60Q8 56 8 50T12 40L40 12Q44 8 50 8Z"/></svg></span>Aris</button>
    <div class="hr"><button type="button" class="mp">DeepSeek V4 Pro<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div></div>
  <div class="col" style="justify-content:center">
    <div class="bot"><p>Chào chị Hằng, em là Aris của phòng Kinh doanh. Phòng mình đang có <span class="bm mai"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="52" r="42"/></svg>Mai</span> dùng chung để trả lời khách.</p><p>Chị muốn em tạo thêm bot riêng cho chị không ạ?</p></div>
    <div class="card" role="group" aria-label="Aris hỏi"><h3>Bot riêng của chị sẽ làm gì?</h3><span class="sub">Bot riêng chỉ chị dùng; skill và kết nối của chị không ai khác dùng được.</span>
      <div class="chips"><button type="button" class="chip">Theo dõi khách của chị</button><button type="button" class="chip">Viết email báo giá</button><button type="button" class="chip">Tổng hợp doanh số tuần</button><button type="button" class="chip">Để sau</button></div>
    </div>
  </div>
  <div class="comp"><div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span style="flex:1">Nhắn Aris</span><button type="button" class="go" aria-label="Gửi"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div></div>
</main>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2960,"height":900}}'>

  renderVals() {
    return { themes: [{ cls: 't-dark' }, { cls: 't-light' }] };
  }
}
</script>
</body>
</html>
